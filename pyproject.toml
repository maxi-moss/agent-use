[project]
name = "broker"
version = "0.1.0"
description = "Routes decisions between one developer and N headless Claude Code sessions driven through Herdr."
requires-python = ">=3.14"
dependencies = ["pydantic>=2.13"]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.1.1,<9",
    "pyright",
    "flake8>=7.3.0",
    "import-linter",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
markers = [
    "unit: fast, no I/O",
    "integration: exercises real subprocess/IO boundaries",
    "scenarios: end-to-end transcript scenarios",
]

[tool.importlinter]
root_packages = ["broker"]

[[tool.importlinter.contracts]]
name = "transcript.raw is only importable by transcript.adapter"
type = "protected"
protected_modules = ["broker.transcript.raw"]
allowed_importers = ["broker.transcript.adapter"]

[[tool.importlinter.contracts]]
name = "hook may only import broker.protocol.constants"
type = "forbidden"
source_modules = ["broker.hook"]
forbidden_modules = [
    "broker.protocol",
    "broker.transcript",
    "broker.herdr",
    "broker.claude",
]
ignore_imports = ["broker.hook.** -> broker.protocol.constants"]
