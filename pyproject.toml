[project]
name = "broker"
version = "0.1.0"
description = "Routes decisions between one developer and N headless Claude Code sessions driven through Herdr."
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.120.0",
    "openai>=3.8.0",
    "pydantic>=2.13",
    "textual>=8.2.8",
    "tree-sitter>=0.26.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.1.1,<9",
    "pyright>=1.1.414",
    "flake8>=7.3.0",
    "import-linter",
    "pytest-asyncio>=1.4.0",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["src", "tests", "scripts"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
ignore = [
    "tests/fixtures",  # sample repos parsed by tests, not code
    "scripts/flake8",
    "scripts/judgment",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
markers = [
    "unit: fast, no I/O",
    "integration: exercises real subprocess/IO boundaries",
    "scenarios: end-to-end transcript scenarios",
]

[tool.importlinter]
root_packages = ["broker"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "process and package layering"
type = "layers"
containers = ["broker"]
exhaustive = true
layers = [
    "master | session | hook",
    "permission | index",
    "llm | claude | herdr | transcript | prompts | decision_log | calibration",
    "config | paths | logging_setup | llm_timing | atomic_json",
    "protocol",
]

[[tool.importlinter.contracts]]
name = "transcript.raw is only importable by transcript.adapter"
type = "protected"
protected_modules = ["broker.transcript.raw"]
allowed_importers = ["broker.transcript.adapter"]

[[tool.importlinter.contracts]]
name = "hook imports only broker.protocol.constants"
type = "forbidden"
source_modules = ["broker.hook"]
forbidden_modules = ["broker.*"]
ignore_imports = ["broker.hook.** -> broker.protocol.constants"]

[[tool.importlinter.contracts]]
name = "hook-path modules import no third-party package"
type = "forbidden"
source_modules = ["broker.hook", "broker.protocol.constants"]
forbidden_modules = ["pydantic", "anthropic", "openai", "textual", "rich", "tree_sitter"]

[[tool.importlinter.contracts]]
name = "only the master imports the Claude Code shared-config writers"
type = "protected"
protected_modules = ["broker.claude.settings", "broker.claude.trust"]
allowed_importers = ["broker.master"]

[[tool.importlinter.contracts]]
name = "permission imports neither transcript nor the shared llm"
type = "forbidden"
source_modules = ["broker.permission"]
forbidden_modules = ["broker.transcript", "broker.llm"]

[[tool.importlinter.contracts]]
name = "session reaches permission only through its public interface"
type = "protected"
protected_modules = ["broker.permission.*"]
allowed_importers = ["broker.permission"]

[[tool.importlinter.contracts]]
name = "index imports only config, paths and logging_setup"
type = "forbidden"
source_modules = ["broker.index"]
forbidden_modules = ["broker.*"]
ignore_imports = [
    "broker.index.** -> broker.config",
    "broker.index.** -> broker.paths",
    "broker.index.** -> broker.logging_setup",
]

[[tool.importlinter.contracts]]
name = "only the session broker consumes the index"
type = "protected"
protected_modules = ["broker.index"]
allowed_importers = ["broker.session.broker", "broker.session.grounding"]

[[tool.importlinter.contracts]]
name = "view model imports only broker.protocol.constants"
type = "forbidden"
source_modules = ["broker.master.viewmodel"]
forbidden_modules = ["broker.*", "broker.master.*", "textual", "rich"]
ignore_imports = ["broker.master.viewmodel -> broker.protocol.constants"]

[[tool.importlinter.contracts]]
name = "master outside tui is frontend-free"
type = "forbidden"
source_modules = ["broker.master"]
forbidden_modules = ["textual", "rich"]
ignore_imports = [
    "broker.master.tui.** -> textual",
    "broker.master.tui.** -> rich",
]

[[tool.importlinter.contracts]]
name = "master entrypoint above tui above core"
type = "layers"
containers = ["broker.master"]
exhaustive = true
layers = [
    "__main__",
    "tui",
    "testmode : llm : runtime : queue : registry : pane_escalations : payload_render : broker_link : registry_reconcile : outcome : notifier : viewmodel",
]
