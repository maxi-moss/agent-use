[project]
name = "broker"
version = "0.1.0"
description = "Routes decisions between one developer and N headless Claude Code sessions driven through Herdr."
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.120.0",
    "openai>=3.8.0",
    "pydantic>=2.13",
    "textual>=8.2.8",
    "tree-sitter>=0.26.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.1.1,<9",
    "pyright>=1.1.414",
    "flake8>=7.3.0",
    "import-linter",
    "pytest-asyncio>=1.4.0",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["src", "tests"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
ignore = [
    "tests/fixtures",  # sample repos parsed by tests, not code
    "scripts/flake8",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
markers = [
    "unit: fast, no I/O",
    "integration: exercises real subprocess/IO boundaries",
    "scenarios: end-to-end transcript scenarios",
]

[tool.importlinter]
root_packages = ["broker"]

[[tool.importlinter.contracts]]
name = "transcript.raw is only importable by transcript.adapter"
type = "protected"
protected_modules = ["broker.transcript.raw"]
allowed_importers = ["broker.transcript.adapter"]

[[tool.importlinter.contracts]]
name = "hook may only import broker.protocol.constants"
type = "forbidden"
source_modules = ["broker.hook"]
forbidden_modules = [
    "broker.protocol",
    "broker.transcript",
    "broker.herdr",
    "broker.claude",
    "broker.master",
    "broker.session",
    "broker.permission",
    "broker.prompts",
    "broker.llm",
    "broker.config",
    "broker.logging_setup",
    "broker.paths",
    "broker.index",
    "broker.decision_log",
]
ignore_imports = ["broker.hook.** -> broker.protocol.constants"]

[[tool.importlinter.contracts]]
name = "session brokers never import the master or Claude Code config writers"
type = "forbidden"
source_modules = ["broker.session"]
forbidden_modules = [
    "broker.master",
    "broker.claude.settings",
    "broker.claude.trust",
]

[[tool.importlinter.contracts]]
name = "master never imports session broker internals (spawn is by subprocess)"
type = "forbidden"
source_modules = ["broker.master"]
forbidden_modules = ["broker.session"]

[[tool.importlinter.contracts]]
name = "permission imports neither broker internals nor the shared llm"
type = "forbidden"
source_modules = ["broker.permission"]
forbidden_modules = [
    "broker.session",
    "broker.master",
    "broker.transcript",
    "broker.llm",
]

[[tool.importlinter.contracts]]
name = "session reaches permission only through its public interface"
type = "protected"
protected_modules = [
    "broker.permission.module",
    "broker.permission.llm",
    "broker.permission.schemas",
    "broker.permission.permission_log",
]
allowed_importers = ["broker.permission"]

[[tool.importlinter.contracts]]
name = "index imports none of the broker's runtime surfaces"
type = "forbidden"
source_modules = ["broker.index"]
forbidden_modules = [
    "broker.session",
    "broker.master",
    "broker.permission",
    "broker.llm",
    "broker.llm_timing",
    "broker.herdr",
    "broker.claude",
    "broker.protocol",
    "broker.transcript",
    "broker.hook",
    "broker.prompts",
]

[[tool.importlinter.contracts]]
name = "only the session broker consumes the index"
type = "protected"
protected_modules = ["broker.index"]
allowed_importers = ["broker.session"]
